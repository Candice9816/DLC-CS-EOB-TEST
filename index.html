<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>开航前检查 - EOB Management</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #0a2a66 0%, #123f8c 55%, #1d5bb5 100%);
    }

    .box {
      width: min(360px, calc(100vw - 32px));
      padding: 28px 28px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 19px;
    }

    p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #64748b;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #123f8c;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .msg {
      min-height: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: #b91c1c;
    }
  </style>
</head>
<body>

    <h1>开航前检查</h1>
    <p>EOB Management · 请输入看板密码</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="密码" autofocus>
    <button type="submit" id="btn">打开看板</button>
    <div class="msg" id="msg"></div>
  </form>

      signed.set(ct, iv.length);
      if (!await crypto.subtle.verify('HMAC', macKey, mac, signed)) return null;

      const aesKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
      const gz = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, ct);
      const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const password = document.getElementById('pw').value;
      if (!password) return;
      btn.disabled = true;
      msg.textContent = '';
      btn.textContent = '正在解密…';
      try {
        const html = await unlock(password);
        if (html === null) {
          msg.textContent = '密码不正确，请重新输入。';
          return;
        }
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        msg.textContent = '无法打开：请使用最新版 Chrome 或 Edge 浏览器。';
      } finally {
        btn.disabled = false;
        btn.textContent = '打开看板';
      }
    });
  </script>
</body>
</html>
