<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CS 工作台</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #0b3a52 0%, #0e6378 55%, #1592a3 100%);
    }

    .box {
      width: min(360px, calc(100vw - 32px));
      padding: 28px 28px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 19px;
    }

    p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #64748b;
    }

    [hidden] { display: none !important; }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      cursor: pointer;
    }

    .auto {
      margin: 0;
      font-size: 15px;
      color: #e3f2ef;
    }

    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #0d7f8c;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .msg {
      min-height: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <!-- 加密外壳：页面内容用 AES-256-CBC 加密（密钥由密码经 PBKDF2-SHA256 派生），HMAC-SHA256 校验密码是否正确 -->
  <form class="box" id="form">
    <h1>CS 工作台</h1>
    <p>DLC Customer Service · 请输入看板密码</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="密码" autofocus>
    <label class="remember"><input type="checkbox" id="remember" checked> 在这台电脑上记住密码，下次自动打开</label>
    <button type="submit" id="btn">打开看板</button>
    <div class="msg" id="msg"></div>
  </form>
  <p class="auto" id="auto" hidden>正在打开 CS 工作台…</p>

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function unlock(password) {
      const salt = b64(PAYLOAD.salt);
      const iv = b64(PAYLOAD.iv);
      const ct = b64(PAYLOAD.ct);
      const mac = b64(PAYLOAD.mac);

      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, 512));

      // 前 32 字节解密，后 32 字节校验；校验不通过 = 密码错误
      const macKey = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
      const signed = new Uint8Array(iv.length + ct.length);
      signed.set(iv);
      signed.set(ct, iv.length);
      if (!await crypto.subtle.verify('HMAC', macKey, mac, signed)) return null;

      const aesKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
      const gz = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, ct);
      const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

      document.querySelector('#form p').textContent = 'DLC Customer Service · 비밀번호를 입력하세요';
      document.getElementById('pw').placeholder = '비밀번호';
      document.querySelector('.remember').lastChild.textContent = ' 이 컴퓨터에서 비밀번호 기억 (다음부터 자동으로 열기)';
      document.getElementById('btn').textContent = '열기';
      document.getElementById('auto').textContent = 'CS 업무 데스크를 여는 중…';
      window.CS_KO = true;
    })();
    const T = (zh, ko) => (window.CS_KO ? ko : zh);
    // 记住密码：只存在这台电脑的这个浏览器里（localStorage），页面里点「退出」会清掉
    const KEY = 'csWorkbenchPw';
    const store = {
      get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
      set(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* 浏览器不允许就不记 */ } },
      clear() { try { localStorage.removeItem(KEY); } catch (e) { /* 忽略 */ } },
    };

    function show(html) {
      document.open();
      document.write(html);
      document.close();
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const password = document.getElementById('pw').value;
      if (!password) return;
      btn.disabled = true;
      msg.textContent = '';
      btn.textContent = T('正在解密…', '여는 중…');
      try {
        const html = await unlock(password);
        if (html === null) {
          msg.textContent = T('密码不正确，请重新输入。', '비밀번호가 맞지 않습니다. 다시 입력해 주세요.');
          return;
        }
        if (document.getElementById('remember').checked) store.set(password); else store.clear();
        show(html);
      } catch (err) {
        msg.textContent = T('无法打开：请使用最新版 Chrome 或 Edge 浏览器。', '열 수 없습니다. 최신 Chrome 또는 Edge 브라우저를 사용해 주세요.');
      } finally {
        btn.disabled = false;
        btn.textContent = T('打开看板', '열기');
      }
    });

    // 打开页面时：记住过密码就直接解密进入；密码改过（解不开）就清掉，显示输入框
    (async () => {
      const saved = store.get();
      if (!saved) return;
      const form = document.getElementById('form');
      const auto = document.getElementById('auto');
      form.hidden = true;
      auto.hidden = false;
      try {
        const html = await unlock(saved);
        if (html !== null) { show(html); return; }
        store.clear();
      } catch (err) { /* 显示输入框，让用户手动输入 */ }
      auto.hidden = true;
      form.hidden = false;
    })();
  </script>
</body>
</html>
